plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0.0"
}

// Release signing — credentialele sunt în android/key.properties.
// rootProject.projectDir == android/ (în Flutter), deci căutăm acolo.
def keystorePropertiesFile = new File(rootProject.projectDir, "key.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
    println "✓ Release keystore configured from: ${keystorePropertiesFile.absolutePath}"
} else {
    println "⚠ No android/key.properties found at ${keystorePropertiesFile.absolutePath} — release build will fail."
}

android {
    namespace = "ro.lavolan.app"
    compileSdk = 35
    // Highest NDK required by any plugin (camera, mlkit, workmanager, etc.).
    // Backward-compatible per AGP guidance.
    ndkVersion = "25.1.8937393"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "ro.lavolan.app"
        minSdk = 23
        targetSdk = 35
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled = true
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                def storeFilePath = keystoreProperties.getProperty("storeFile")
                // storeFile path is relative to android/ (the project dir).
                // Resolve it explicitly so AGP always gets an absolute file.
                def resolvedStoreFile = new File(rootProject.projectDir, storeFilePath)
                if (!resolvedStoreFile.exists()) {
                    // try as-is in case the user wrote an absolute path
                    resolvedStoreFile = file(storeFilePath)
                }
                println "  signing storeFile = ${resolvedStoreFile.absolutePath} (exists: ${resolvedStoreFile.exists()})"
                storeFile resolvedStoreFile
                storePassword keystoreProperties.getProperty("storePassword")
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            // Keystore-ul de release e în repo (android/keystore/release.jks)
            // cu credentialele în android/key.properties.
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE", "META-INF/LICENSE.txt", "META-INF/license.txt", "META-INF/NOTICE", "META-INF/NOTICE.txt", "META-INF/notice.txt", "META-INF/ASL2.0"]
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}
