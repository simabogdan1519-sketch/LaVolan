name: lavolan
description: "LaVolan - Smart Digital Vehicle Assistant for Romania"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local storage (offline-first)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Notifications & background
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  workmanager: ^0.5.2
  permission_handler: ^11.3.1

  # Camera + OCR
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.1

  # UI
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  palette_generator: ^0.3.3+7
  material_color_utilities: ^0.11.1

  # Utilities
  uuid: ^4.4.2
  path: ^1.9.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.3
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
